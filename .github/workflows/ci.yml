name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Verify dist artifact
        run: ls -la dist/index.js

      - name: Descriptor lock (tools/list vs test/tools.lock.json)
        run: npm run test:descriptors

      - name: Drift + unit tests (offline)
        run: npm test
