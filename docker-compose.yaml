# mcp-saos - orzeczenia SAOS z lokalnej kopii dumpu (Streamable HTTP, /mcp). Stack Portainera "mcp-saos".
# Bez portu na hoscie. Dostep wylacznie: https://mcp-saos.xlap.pl/mcp - tunel cloudflared + Access (Managed OAuth).
# cf_mcp_saos: cloudflared + ten serwis, z wyjsciem do internetu (API/dump SAOS, Tor awaryjnie).
# /data: baza SQLite (~30 GB po pelnym pobraniu); pierwsze pobranie wznawia sie po restarcie,
# potem codziennie o SAOS_SYNC_AT przyrostowo (sinceModificationDate). Stan: GET /status (przez tunel).
services:
  mcp-saos:
    build: /volume2/docker/mcp-saos
    image: mcp-saos:latest
    container_name: mcp-saos
    user: "1026:100"
    environment:
      - TZ=Europe/Warsaw
      - SAOS_SYNC_AT=03:30
      - SAOS_SYNC_CONCURRENCY=3
    volumes:
      - /volume2/docker/mcp-saos/data:/data
    networks:
      - cf_mcp_saos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  cf_mcp_saos:
    external: true
